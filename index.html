function tagOpts(cur){const o=[];const walk=(p,d)=>ctags.filter(x=>(x.parent||"")===p).forEach(x=>{o.push('<option value="'+esc(x.id)+'"'+(x.id===cur?" selected":"")+">"+"— ".repeat(d)+esc(x.name)+"</option>");walk(x.id,d+1)});walk("",0);return o.join("")}

  const w=(id,o)=>{ctags.push({id,...o});dbw(db.collection("tags").doc(id).set(o))};

const ORD=["tas","sch","cal","rut","usr"];

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));

document.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;sok=e.touches.length===1&&$("#sheet").hidden&&!e.target.closest("input,select,textarea")},{passive:true});

},{passive:true});
function pick(d){sel=d;render()}

      const dots=ev.slice(0,4).map(t=>'<span class="ev'+(t.done?" done":"")+'" style="background:'+tcol(tagId(t))+'">'+esc(t.title)+"</span>").join("")+(ev.length>4?'<span class="more">+'+(ev.length-4)+" más</span>":"");
      h+='<button class="day'+(ds===sel?" sel":"")+(ds===today()?" tod":"")+(wd===0||wd===6?" we":"")+'" onclick="pick(\''+ds+'\')"><b>'+d.getDate()+"</b>"+dots+"</button>";

  h+=routines.length?routines.slice().sort((a,b)=>(a.created||"").localeCompare(b.created||"")||a.title.localeCompare(b.title)).map(r=>{
    const e=r.every||1,tm=times(r);
    return '<div class="row"><div class="rinfo"><b>'+esc(r.title)+"</b><small>"+(e===1?"Cada día":"Cada "+e+" días")+" · "+tm.length+(tm.length===1?" vez":" veces")+(tm.some(Boolean)?" ("+tm.filter(Boolean).map(esc).join(", ")+")":"")+'</small></div><button class="ib" aria-label="Editar" onclick="openRoutine(\''+r.id+'\')">'+PEN+"</button></div>";
  }).join(""):'<p class="mut">Aún no tienes rutinas.</p>';
  return h;
}
function userView(){
  const u=firebase.auth().currentUser,n=u?(u.displayName||(u.email||"").split("@")[0]):"";
  return '<h3 style="text-transform:none">Mi cuenta</h3><div class="row"><span class="mut">Usuario</span><span class="t"><b>'+esc(n)+'</b></span></div><div class="row"><span class="mut">Contraseña</span><span class="t" id="pw" style="letter-spacing:3px">•••••</span><button class="ib" id="eye" aria-label="Mantén pulsado para ver la contraseña" onpointerdown="peek(1)" onpointerup="peek(0)" onpointerleave="peek(0)" onpointercancel="peek(0)" oncontextmenu="return false">'+EYE+'</button></div><p class="mut">Mantén pulsado el ojo para ver la contraseña.</p><button class="add" style="margin-top:20px" onclick="if(this.dataset.s){logout()}else{this.dataset.s=1;this.textContent=\'¿Seguro? Pulsa otra vez\'}">Cerrar sesión</button>';
}
function peek(v){const p=$("#pw");if(!p)return;let pin="";try{pin=localStorage.getItem("agenda_pin")||""}catch(e){}p.textContent=v?(pin||"No guardada en este dispositivo"):"•••••"}
function logout(){try{localStorage.removeItem("agenda_pin")}catch(e){}firebase.auth().signOut().then(()=>location.reload())}
function ttog(id){const t=tasks.find(x=>x.id===id);t.done=!t.done;render();dbw(db.collection("tasks").doc(id).update({done:t.done}))}
function tdel(id){tasks=tasks.filter(x=>x.id!==id);render();dbw(db.collection("tasks").doc(id).delete())}
function todog(id){const t=todos.find(x=>x.id===id);t.done=!t.done;render();dbw(db.collection("todos").doc(id).update({done:t.done}))}
function todel(id){todos=todos.filter(x=>x.id!==id);render();dbw(db.collection("todos").doc(id).delete())}
function tog(rid,d,i){
  const r=routines.find(x=>x.id===rid),k=rid+"_"+d,n=times(r).length,s=(logs[k]||[]).slice();
  while(s.length<n)s.push(false);
  s[i]=!s[i];logs[k]=s;render();dbw(db.collection("logs").doc(k).set({s}));
}
function sheet(h){const s=$("#sheet");s.innerHTML='<div class="box">'+h+"</div>";s.hidden=false}
function shut(){$("#sheet").hidden=true}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")shut()});

function openTask(date,id){
  const t=id?tasks.find(x=>x.id===id):null;edId=id||null;
  sheet("<h3>"+(t?"Editar escolar":"Nuevo escolar")+'</h3><input id="tt" placeholder="Título" maxlength="120" value="'+esc(t?t.title:"")+'"><input id="td" type="date" value="'+(t?t.date:(date||today()))+'"><label>Etiqueta <select id="tg"><option value="">Sin etiqueta</option>'+tagOpts(t?tagId(t):"")+'</select></label><label>Importancia <select id="ti">'+[["0","Ninguna"],["1","Baja !"],["2","Media !!"],["3","Alta !!!"]].map(([v,n])=>'<option value="'+v+'"'+(t&&String(t.imp||0)===v?" selected":"")+">"+n+"</option>").join("")+'</select></label><div class="act"><button onclick="shut()">Cancelar</button><button class="pri" onclick="saveTask()">Guardar</button></div>');
  $("#tt").focus();
}
function saveTask(){
  const title=$("#tt").value.trim(),date=$("#td").value;
  if(!title||!date){$("#tt").focus();return}
  const id=edId||uid(),old=tasks.find(x=>x.id===id),o={title,date,tag:$("#tg").value,imp:+$("#ti").value,done:old?!!old.done:false};
  tasks=tasks.filter(x=>x.id!==id);tasks.push({id,...o});shut();render();dbw(db.collection("tasks").doc(id).set(o));
}
function openTodo(id){
  const t=id?todos.find(x=>x.id===id):null,p=t?t.pri||3:3;edId=id||null;
  sheet("<h3>"+(t?"Editar tarea":"Nueva tarea")+'</h3><input id="tt" placeholder="Ej. Llamar a mamá" maxlength="120" value="'+esc(t?t.title:"")+'"><label>Vence el (opcional) <input id="td" type="date" value="'+(t&&t.due?t.due:"")+'"></label><div>Prioridad</div><div class="rw" style="align-items:center;margin:0"><span id="pv">'+star(p,36)+'</span><input id="tp" class="rg" type="range" min="1" max="5" step="1" value="'+p+'" oninput="prv()"></div><div class="act"><button onclick="shut()">Cancelar</button><button class="pri" onclick="saveTodo()">Guardar</button></div>');
  $("#tt").focus();
}
function saveTodo(){
  const title=$("#tt").value.trim();if(!title){$("#tt").focus();return}
  const id=edId||uid(),old=todos.find(x=>x.id===id),o={title,done:old?!!old.done:false,pri:+$("#tp").value,created:old&&old.created?old.created:Date.now()};
  if($("#td").value)o.due=$("#td").value;
  todos=todos.filter(x=>x.id!==id);todos.push({id,...o});shut();render();dbw(db.collection("todos").doc(id).set(o));
}
function openTags(){tmode={m:"new"};sheet('<h3>Etiquetas</h3><div id="tl"></div><div id="tf"></div><div class="act"><button class="pri" onclick="shut()">Listo</button></div>');tlist()}
function tlist(){
  const rows=[],walk=(p,d)=>ctags.filter(x=>(x.parent||"")===p).forEach(x=>{
    rows.push('<div class="row" style="margin-left:'+d*18+'px"><span class="tag" style="background:'+tcol(x.id)+'">'+esc(x.name)+'</span>'+(ctags.some(y=>y.parent===x.id)?'<button class="x tw'+(topen[x.id]?" op":"")+'" onclick="ttoggle(\''+x.id+'\')">ˇ</button>':"")+'<span class="t"></span><button class="ib" onclick="tedit(\''+x.id+'\')">'+PEN+'</button><button class="x" onclick="tsub(\''+x.id+'\')">+</button><button class="x" onclick="tdelc(\''+x.id+'\',this)">×</button></div>');if(topen[x.id])walk(x.id,d+1);
  });
  walk("",0);
  $("#tl").innerHTML=rows.join("")||'<p class="mut">No hay etiquetas.</p>';
  const m=tmode,x=m.id?tagById(m.id):null,root=m.m==="new"||(m.m==="edit"&&x&&!x.parent);
  $("#tf").innerHTML="<h4>"+(m.m==="new"?"Nueva etiqueta":m.m==="sub"?"Nueva rama de "+esc(x.name):"Editar "+esc(x.name))+'</h4><div class="rw"><input id="tn" maxlength="24" placeholder="Nombre" value="'+(m.m==="edit"?esc(x.name):"")+'">'+(root?'<input id="tc" type="color" value="'+(m.m==="edit"&&x.color?esc(x.color):"#8b5cf6")+'" style="width:56px;padding:2px">':"")+'<button class="pri" onclick="tsave()">Guardar</button>'+(m.m!=="new"?'<button onclick="tmode={m:\'new\'};tlist()">Cancelar</button>':"")+"</div>"+(root?"":'<p class="mut" style="margin:0">Las ramas usan el color de su etiqueta principal.</p>');
}
function tedit(id){tmode={m:"edit",id};tlist()}
function tsub(id){topen[id]=true;tmode={m:"sub",id};tlist()}
function ttoggle(id){topen[id]=!topen[id];tlist()}
function tsave(){
  const name=$("#tn").value.trim();if(!name)return;
  const m=tmode,c=$("#tc")?$("#tc").value:null;
  if(m.m==="edit"){const x=tagById(m.id),o={name};x.name=name;if(c){x.color=c;o.color=c}dbw(db.collection("tags").doc(x.id).update(o))}
  else{const id=uid(),o={name};if(m.m==="sub")o.parent=m.id;else o.color=c;ctags.push({id,...o});dbw(db.collection("tags").doc(id).set(o))}
  tmode={m:"new"};tlist();render();
}
function tdelc(id,b){
  if(!b.dataset.s){b.dataset.s=1;b.textContent="¿Seguro?";return}
  const ids=[id];for(let i=0;i<ids.length;i++)ctags.filter(x=>x.parent===ids[i]).forEach(x=>ids.push(x.id));
  ctags=ctags.filter(x=>!ids.includes(x.id));if(tmode.id&&ids.includes(tmode.id))tmode={m:"new"};
  ids.forEach(i=>dbw(db.collection("tags").doc(i).delete()));tlist();render();
}

function openRoutine(id){
  const r=routines.find(x=>x.id===id);reid=id||null;rt=r?times(r).slice():[""];
  sheet("<h3>"+(r?"Editar":"Nueva")+' rutina</h3><input id="rn" maxlength="80" placeholder="Nombre (ej. Lavarme los dientes)" value="'+esc(r?r.title:"")+'"><label>Se repite cada <input id="re" type="number" min="1" max="365" value="'+(r?r.every||1:1)+'" style="width:5em"> día(s)</label><div>Veces al día (un interruptor por cada vez)</div><div id="rl"></div><button onclick="rt.push(\'\');rlist()">+ Añadir vez</button><small class="mut">Si es una sola vez y no escribes palabra, saldrá solo una casilla de hecho / no hecho.</small><div class="act">'+(r?'<button class="dng" onclick="if(this.dataset.s){delR()}else{this.dataset.s=1;this.textContent=\'¿Seguro? Pulsa otra vez\'}">Borrar</button>':"")+'<button onclick="shut()">Cancelar</button><button class="pri" onclick="saveR()">Guardar</button></div>');
  rlist();
}
function rlist(){
  $("#rl").innerHTML=rt.map((w,i)=>'<div class="rw"><input maxlength="14" placeholder="Una palabra (opcional)" value="'+esc(w)+'" oninput="this.value=this.value.replace(/\\s/g,\'\');rt['+i+']=this.value"><button onclick="rt.splice('+i+',1);rlist()" '+(rt.length<2?"disabled":"")+">×</button></div>").join("");
}
function saveR(){
  const title=$("#rn").value.trim();if(!title){$("#rn").focus();return}
  const old=routines.find(x=>x.id===reid),id=reid||uid();
  const o={title,every:Math.max(1,parseInt($("#re").value)||1),times:rt.slice(),created:old?old.created:today()};
  routines=routines.filter(x=>x.id!==id);routines.push({id,...o});shut();render();dbw(db.collection("routines").doc(id).set(o));
}
function delR(){routines=routines.filter(x=>x.id!==reid);shut();render();dbw(db.collection("routines").doc(reid).delete())}
const EM=u=>u.toLowerCase()+"@agenda-user.app",PW=p=>p+"-agenda";
async function connect(){
  try{
    firebase.initializeApp(FB);
    const auth=firebase.auth(),fs=firebase.firestore();
    try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    let user=await new Promise(res=>{const u=auth.onAuthStateChanged(x=>{u();res(x)})});
    if(!user)user=await authScreen(auth);
    document.body.classList.remove("noauth");
    return {collection:n=>fs.collection("users").doc(user.uid).collection(n)};
  }catch(e){console.error(e);return null}
}
function authScreen(auth){
  return new Promise(res=>{
    let mode="in";
    const ERR={"auth/email-already-in-use":"Ese nombre de usuario ya está cogido.","auth/invalid-credential":"Usuario o contraseña incorrectos.","auth/wrong-password":"Usuario o contraseña incorrectos.","auth/user-not-found":"Usuario o contraseña incorrectos.","auth/operation-not-allowed":"Falta activar el acceso con correo y contraseña en Firebase.","auth/network-request-failed":"Sin conexión a internet.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos."};
    const submit=async()=>{
      const u=$("#au").value.trim(),p=$("#ap").value,e=$("#ae");
      if(!/^[A-Za-z0-9_-]{4,16}$/.test(u)){e.textContent="El nombre debe tener de 4 a 16 caracteres: letras (sin ñ ni acentos), números, _ o -.";return}
      if(!/^\d{5}$/.test(p)){e.textContent="La contraseña son 5 números.";return}
      if(mode==="up"&&p!==$("#ac").value){e.textContent="Las contraseñas no coinciden.";return}
      $("#ab").disabled=true;e.textContent="";
      try{
        let c;
        if(mode==="up"){c=await auth.createUserWithEmailAndPassword(EM(u),PW(p));await c.user.updateProfile({displayName:u})}
        else c=await auth.signInWithEmailAndPassword(EM(u),PW(p));
        try{localStorage.setItem("agenda_pin",p)}catch(x){}
        res(c.user);
      }catch(x){e.textContent=(ERR[x.code]||"Error al entrar.")+" ("+(x.code||x.message)+")";$("#ab").disabled=false}
    };
    const draw=()=>{
      const pw='type="password" inputmode="numeric" pattern="[0-9]*" maxlength="5"';
      $("#app").innerHTML='<div class="auth"><div class="logo">📅</div><h2>Mi agenda</h2><div class="seg"><button id="m1" class="'+(mode==="in"?"on":"")+'">Iniciar sesión</button><button id="m2" class="'+(mode==="up"?"on":"")+'">Crear cuenta</button></div><input id="au" placeholder="Nombre de usuario" maxlength="16" autocapitalize="none" autocorrect="off" autocomplete="username"><input id="ap" '+pw+' placeholder="Contraseña (5 números)" autocomplete="'+(mode==="in"?"current-password":"new-password")+'">'+(mode==="up"?'<input id="ac" '+pw+' placeholder="Repite la contraseña" autocomplete="new-password">':"")+'<p id="ae" class="mut"></p><button class="pri" id="ab">'+(mode==="in"?"Entrar":"Crear cuenta")+"</button>"+(mode==="up"?'<p class="mut">Nombre: 4 a 16 caracteres (letras sin ñ ni acentos, números, _ o -). Contraseña: 5 números.</p>':"")+"</div>";
      $("#m1").onclick=()=>{mode="in";draw()};$("#m2").onclick=()=>{mode="up";draw()};$("#ab").onclick=submit;
      document.querySelectorAll("#ap,#ac").forEach(i=>i.oninput=()=>{i.value=i.value.replace(/\D/g,"")});
    };
    draw();
  });
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
init();
</script></body></html>
